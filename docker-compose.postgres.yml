version: "3.8"

services:
  server:
    build:
      args:
        GUARDIAN_SERVER_FEATURES: postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://guardian:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/guardian

  postgres:
    image: postgres:16-alpine
    ports:
      # Bind to loopback only. The server reaches Postgres over the Compose
      # network (DATABASE_URL uses the `postgres` service name), so a published
      # host port is only for host-side access (psql, benchmarks). Publishing on
      # 0.0.0.0 would expose the database to the public internet on any host with
      # a public IP and no firewall.
      - "127.0.0.1:5432:5432"
    volumes:
      - guardian-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=guardian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  guardian-postgres:
